<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="50%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="50%" stop-color="#00D9F5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#00D9F5" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.5"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 54px;
      font-weight: 900;
      letter-spacing: 4px;
      fill: url(#primaryGrad);
    }
    .badge-text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: #00F5A0;
    }
    .role-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: 0.8px;
      fill: #e6edf3;
    }
    .stats-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      font-weight: 500;
      fill: #8b949e;
    }
  </style>

  <!-- Background Base Container -->
  <rect x="2" y="2" width="1196" height="236" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Cyber Grid Pattern -->
  <g stroke="#1a2333" stroke-width="0.8" opacity="0.4">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="150" y1="0" x2="150" y2="240" />
    <line x1="300" y1="0" x2="300" y2="240" />
    <line x1="450" y1="0" x2="450" y2="240" />
    <line x1="600" y1="0" x2="600" y2="240" />
    <line x1="750" y1="0" x2="750" y2="240" />
    <line x1="900" y1="0" x2="900" y2="240" />
    <line x1="1050" y1="0" x2="1050" y2="240" />
  </g>

  <!-- Flowing Bottom Ambient Wave Curves -->
  <path d="M0,170 Q300,120 600,165 T1200,140 L1200,240 L0,240 Z" fill="#00F5A0" fill-opacity="0.06"/>
  <path d="M0,195 Q350,150 700,190 T1200,175 L1200,240 L0,240 Z" fill="#00D9F5" fill-opacity="0.08"/>
  <path d="M0,215 Q400,180 800,210 T1200,205 L1200,240 L0,240 Z" fill="#6366F1" fill-opacity="0.1"/>

  <!-- Corner Tech Accents -->
  <path d="M12,30 L12,12 L30,12" stroke="#00F5A0" stroke-width="2.5" fill="none"/>
  <path d="M1188,30 L1188,12 L1170,12" stroke="#00D9F5" stroke-width="2.5" fill="none"/>
  <path d="M12,210 L12,228 L30,228" stroke="#6366F1" stroke-width="2.5" fill="none"/>
  <path d="M1188,210 L1188,228 L1170,228" stroke="#00F5A0" stroke-width="2.5" fill="none"/>

  <!-- System Badge -->
  <g transform="translate(600, 48)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#00F5A0" fill-opacity="0.1" stroke="#00F5A0" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="-116" cy="0" r="4.5" fill="#00F5A0" filter="url(#glow)"/>
    <text text-anchor="middle" y="4.5" class="badge-text">SYSTEM IDENTIFIER // H-DEVZ</text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(600, 114)">
    <text text-anchor="middle" class="title">HARSHIT // H-DEVZ</text>
  </g>

  <!-- Subtitle & Role Description -->
  <g transform="translate(600, 156)">
    <text text-anchor="middle" class="role-text">Full-Stack Software Engineer &amp; Digital Craftsman</text>
  </g>

  <!-- Live Status & Stack Matrix -->
  <g transform="translate(600, 194)">
    <text text-anchor="middle" class="stats-text">
      NEXT.JS 15  •  TYPESCRIPT  •  REACT 19  •  NODE.JS  •  CLOUD APIS  •  SUB-SECOND LATENCY
    </text>
  </g>
</svg>
