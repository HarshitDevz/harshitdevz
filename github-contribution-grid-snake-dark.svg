<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="200">
  <defs>
    <style>
      .bg { fill: #0b0f19; rx: 12px; }
      .header-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #f0f6fc; }
      .cell { width: 11px; height: 11px; rx: 2.5px; }
      .c0 { fill: #161b22; }
      .c1 { fill: #0e4429; }
      .c2 { fill: #006d32; }
      .c3 { fill: #26a641; }
      .c4 { fill: #39d353; }

      /* Snake Movement Across the Board */
      @keyframes slitherGroup {
        0% { transform: translate(60px, 30px); }
        15% { transform: translate(240px, 30px); }
        25% { transform: translate(240px, 60px); }
        40% { transform: translate(420px, 60px); }
        55% { transform: translate(420px, 15px); }
        70% { transform: translate(620px, 15px); }
        85% { transform: translate(620px, 75px); }
        100% { transform: translate(60px, 30px); }
      }

      .snake-carrier {
        animation: slitherGroup 14s infinite ease-in-out;
      }

      /* Eating pulse */
      @keyframes eatPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.2); }
      }
      .snake-head-box {
        animation: eatPulse 0.4s infinite alternate;
      }
    </style>
  </defs>

  <!-- Background container -->
  <rect width="850" height="200" class="bg" stroke="#30363d" stroke-width="1"/>

  <!-- Header with Icon and Title -->
  <g transform="translate(24, 25)">
