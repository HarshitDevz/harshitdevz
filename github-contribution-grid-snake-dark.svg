    <path d="M4 12a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4 4 4 0 0 1-4 4H8a4 4 0 0 1-4-4zm8-2H8a2 2 0 0 0 0 4h4a2 2 0 0 0 0-4z" fill="#00F5A0"/>
    <circle cx="16" cy="12" r="1.5" fill="#e879f9"/>
    <text x="24" y="14" class="header-text">Contribution Snake</text>
    <text x="165" y="14" font-family="monospace" font-size="11" fill="#00F5A0">● HARSHIT // H-DEVZ LIVE RUN</text>
    <text x="790" y="14" text-anchor="end" font-family="monospace" font-size="11" fill="#8b949e">951 COMMITS</text>
  </g>

