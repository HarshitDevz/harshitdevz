<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="100%" height="360">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#0b111e"/>
    </linearGradient>
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="termGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes typeLine1 {
      0% { opacity: 0; }
      5%, 100% { opacity: 1; }
    }
    @keyframes typeLine2 {
      0%, 12% { opacity: 0; }
      16%, 100% { opacity: 1; }
    }
    @keyframes typeLine3 {
      0%, 25% { opacity: 0; }
      30%, 100% { opacity: 1; }
    }
    @keyframes typeLine4 {
      0%, 42% { opacity: 0; }
      47%, 100% { opacity: 1; }
    }
    @keyframes typeLine5 {
      0%, 60% { opacity: 0; }
      65%, 100% { opacity: 1; }
    }
    @keyframes typeLine6 {
      0%, 75% { opacity: 0; }
      80%, 100% { opacity: 1; }
    }
    @keyframes typeLine7 {
      0%, 88% { opacity: 0; }
      92%, 100% { opacity: 1; }
    }

    .cursor {
      animation: blink 0.9s infinite;
      fill: #10b981;
    }
    .line1 { animation: typeLine1 10s infinite; }
    .line2 { animation: typeLine2 10s infinite; }
    .line3 { animation: typeLine3 10s infinite; }
    .line4 { animation: typeLine4 10s infinite; }
    .line5 { animation: typeLine5 10s infinite; }
    .line6 { animation: typeLine6 10s infinite; }
    .line7 { animation: typeLine7 10s infinite; }

    .term-title {
      font-family: ui-monospace, SFMono-Regular, "Fira Code", Menlo, Consolas, monospace;
      font-size: 12px;
      font-weight: 600;
      fill: #94a3b8;
    }
    .code-text {
      font-family: ui-monospace, SFMono-Regular, "Fira Code", Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.6;
    }
    .prompt { fill: #10b981; font-weight: 700; }
    .user { fill: #06b6d4; font-weight: 600; }
    .cmd { fill: #f8fafc; font-weight: 600; }
    .out-title { fill: #e2e8f0; font-weight: 500; }
    .out-json { fill: #38bdf8; font-weight: 500; }
    .out-status { fill: #34d399; font-weight: 600; }
    .out-dim { fill: #64748b; }
    .badge-live {
      font-family: ui-monospace, SFMono-Regular, "Fira Code", monospace;
      font-size: 10px;
      font-weight: 700;
      fill: #10b981;
    }
  </style>

  <!-- Chassis / Window Background -->
  <rect x="2" y="2" width="856" height="356" rx="14" fill="url(#termBg)" stroke="url(#termBorder)" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <rect x="2" y="2" width="856" height="38" rx="14" fill="#0d1424"/>
  <rect x="2" y="28" width="856" height="12" fill="#0d1424"/>
  <line x1="2" y1="40" x2="858" y2="40" stroke="#1f293d" stroke-width="1"/>

  <!-- Window Action Buttons (Red, Amber, Green) -->
  <circle cx="24" cy="20" r="5.5" fill="#ef4444"/>
  <circle cx="42" cy="20" r="5.5" fill="#f59e0b"/>
  <circle cx="60" cy="20" r="5.5" fill="#10b981"/>

  <!-- Terminal Window Title -->
  <text x="430" y="25" text-anchor="middle" class="term-title">harshit@chitkara-node: ~ (zsh / interactive-cli)</text>

  <!-- Live Pulse Dot & Tag -->
  <circle cx="800" cy="20" r="3.5" fill="#10b981" filter="url(#termGlow)"/>
  <text x="812" y="24" class="badge-live">LIVE</text>

  <!-- TERMINAL CONTENT LINES -->
  <g class="code-text" transform="translate(24, 72)">
    
    <!-- Line 1: whoami command -->
    <g class="line1">
      <text x="0" y="0">
        <tspan class="prompt">harshit@chitkara</tspan><tspan class="out-dim">:</tspan><tspan class="user">~</tspan><tspan class="prompt">$ </tspan><tspan class="cmd">whoami</tspan>
      </text>
    </g>

    <!-- Line 2: whoami output -->
    <g class="line2">
      <text x="0" y="26">
        <tspan class="out-dim">↳ </tspan><tspan class="out-title">Harshit</tspan><tspan class="out-dim"> — </tspan><tspan class="out-status">Full-Stack Developer &amp; AI Systems Builder</tspan><tspan class="out-dim"> @ Chitkara University, Punjab 🇮🇳</tspan>
      </text>
    </g>

    <!-- Line 3: cat wearbuy command -->
    <g class="line3">
      <text x="0" y="66">
        <tspan class="prompt">harshit@chitkara</tspan><tspan class="out-dim">:</tspan><tspan class="user">~/projects</tspan><tspan class="prompt">$ </tspan><tspan class="cmd">cat wearbuy.spec.json</tspan>
      </text>
    </g>

    <!-- Line 4: cat wearbuy output -->
    <g class="line4">
      <text x="0" y="92">
        <tspan class="out-dim">↳ </tspan><tspan class="out-json">{ "flagship": "WearBuy", "model": "Hyperlocal 60-Min Fashion", "returns": "1-Hr Return Window", "sla": "30-60 Mins" }</tspan>
      </text>
    </g>

    <!-- Line 5: jarvis command -->
    <g class="line5">
      <text x="0" y="132">
        <tspan class="prompt">harshit@chitkara</tspan><tspan class="out-dim">:</tspan><tspan class="user">~/ai</tspan><tspan class="prompt">$ </tspan><tspan class="cmd">python3 jarvis.py --status</tspan>
      </text>
    </g>

    <!-- Line 6: jarvis output -->
    <g class="line6">
      <text x="0" y="158">
        <tspan class="out-dim">↳ </tspan><tspan class="out-status">[ONLINE]</tspan><tspan class="out-title"> Autonomous Voice Assistant · Speech NLP Kernel Ready · Sub-second execution</tspan>
      </text>
    </g>

    <!-- Line 7: interactive shell prompt with blinking cursor -->
    <g class="line7">
      <text x="0" y="198">
        <tspan class="prompt">harshit@chitkara</tspan><tspan class="out-dim">:</tspan><tspan class="user">~</tspan><tspan class="prompt">$ </tspan><tspan class="cmd">harshit-cli --interactive-shell</tspan>
      </text>
      <text x="0" y="224">
        <tspan class="out-status">✓ Shell operational.</tspan><tspan class="out-dim"> Click buttons below to launch live in browser: </tspan>
        <tspan class="cursor">█</tspan>
      </text>
    </g>

  </g>
</svg>
